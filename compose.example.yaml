services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: running_showcase
      POSTGRES_USER: running
      POSTGRES_PASSWORD: change-me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - running_showcase_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U running -d running_showcase"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://running:change-me@db:5432/running_showcase
      DIRECT_URL: postgresql://running:change-me@db:5432/running_showcase
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://running:change-me@db:5432/running_showcase
      DIRECT_URL: postgresql://running:change-me@db:5432/running_showcase
      APP_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      SESSION_DAYS: "30"
      NODE_ENV: development
      PORT: "3333"
    ports:
      - "127.0.0.1:3333:3333"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend-corrida
    environment:
      API_INTERNAL_URL: http://api:3333
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/entrar').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  running_showcase_data:
